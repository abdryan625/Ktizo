<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Portfolio Windows XP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Le Bureau Windows XP -->
    <div id="desktop">

        <!-- Icône de bureau : Projets -->
        <div class="desktop-icon">
            <img src="icons/All Programs.ico" alt="Dossier Projets">
            <span>Ktizo.exe</span>
        </div>

        <!-- Icône de bureau : À propos -->
        <div class="desktop-icon">
            <img src="icons/Windows Explorer.ico" alt="Icône Utilisateur">
            <span>A_propos.txt</span>
        </div>

        <!-- Icône de bureau : Contact -->
        <div class="desktop-icon">
            <img src="icons/My shared Folders.ico" alt="Icône Mail">
            <span>Contact.lnk</span>
        </div>

    </div>

    <!-- La Barre des Tâches en bas -->
    <div id="taskbar">
        <!-- Bouton Démarrer -->
        <button id="start-btn">
            <img src="icons/start.png" alt="Logo Start">
            <span>Démarrer</span>
        </button>

        <!-- Zone des tâches en cours -->


        
    </div>

</body>
</html>
